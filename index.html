<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Design</title>
  </head>
  <body>
    <script>
      //create section//
      let header = document.createElement("div");
      let icon = document.createElement("h2");
      let menu = document.createElement("ul");
      let menuItem1 = document.createElement("li");
      let menuItem2 = document.createElement("li");
      let menuItem3 = document.createElement("li");
      let menuItem4 = document.createElement("li");
      let menuItems = [menuItem1, menuItem2, menuItem3, menuItem4];
      let container = document.createElement("div");
      let productsName = [];
      for (let i = 1; i <= 15; i++) {
        productsName.push(`product-${i}`);
      }
      let productsDivs = productsName.map(function (name) {
        let div = document.createElement("div");
        div.textContent = name;
        return div;
      });
      let footer = document.createElement("footer");
      //append section//
      for (let i = 0; i < menuItems.length; i++) {
        menu.appendChild(menuItems[i]);
      }
      header.appendChild(icon);
      header.appendChild(menu);

      for (let i = 0; i < productsName.length; i++) {
        container.appendChild(productsDivs[i]);
      }

      document.body.appendChild(header);
      document.body.appendChild(container);
      document.body.appendChild(footer);

      //content section//
      icon.textContent = "Elzero";
      menuItem1.textContent = "Home";
      menuItem2.textContent = "Contact";
      menuItem3.textContent = "support";
      menuItem4.textContent = "galery";
      footer.textContent = "Copyright 2022";
      //style section//
      header.style.cssText =
        "width: 100%; height: 50px; background-color: white; margin: 0; padding: 0; display: flex; align-items: center; justify-content: space-between; border-bottom: solid 1px black";

      icon.style.cssText = "color: rgb(92, 146, 60); padding: 20px;";

      menu.style.cssText =
        "list-style: none; display: flex; padding: 0; margin: 0;";

      for (let i = 0; i < menuItems.length; i++) {
        menuItems[i].style.cssText = "color: #424141; padding: 10px;";
      }

      container.style.cssText =
        "width: calc(100% - 40px); height: calc(100% - 100px); background-color: #b5b3b3; padding: 20px; margin: 0px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: auto; gap: 20px;";

      for (let i = 0; i < productsDivs.length; i++) {
        productsDivs[i].style.cssText =
          "background-color: white; padding: 20px; text-align: center; font-size: 20px; color: rgb(92, 146, 60);";
      }

      footer.style.cssText =
        "width: 100%; height: 50px; background-color: rgb(92, 146, 60); color: white; display: flex; align-items: center; justify-content: center;";

      document.body.style.cssText =
        "padding: 0; margin: 0; height: 100vh; display: flex; flex-direction: column;";
    </script>
  </body>
</html>
